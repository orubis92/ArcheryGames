<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1f3b2d" />
    <link rel="icon" type="image/svg+xml" href="./icons/icon.svg" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />
    <title>Archery Games</title>
    <script>
      // Dopo una pubblicazione, un index.html in cache può puntare a un bundle
      // non più presente (404): in quel caso si ricarica una volta sola.
      window.addEventListener(
        'error',
        function (e) {
          var t = e.target;
          if (t && (t.tagName === 'SCRIPT' || t.tagName === 'LINK') && !sessionStorage.getItem('ag-ricaricato')) {
            sessionStorage.setItem('ag-ricaricato', '1');
            location.reload();
          }
        },
        true
      );
      window.addEventListener('load', function () {
        setTimeout(function () { sessionStorage.removeItem('ag-ricaricato'); }, 5000);
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
